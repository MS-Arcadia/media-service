[project]
name = "arcadia-media-service"
version = "0.1.0"
description = "Arcadia media service — the platform's file store"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "aiokafka>=0.12,<1.0",
    "pyjwt>=2.9,<3.0",
    "prometheus-client>=0.21,<1.0",
    "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "ASYNC",# async correctness
    "S",    # security (bandit)
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    # Asserts in tests are the point of tests.
    "S101",
    # FastAPI's dependency injection is function calls in defaults by design.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures use predictable ids and throwaway secrets on purpose.
"tests/*" = ["S105", "S106", "S311"]
